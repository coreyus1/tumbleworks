<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a616a"/>
      <stop offset="1" stop-color="#15181b"/>
    </linearGradient>
    <pattern id="brush" width="14" height="1024" patternUnits="userSpaceOnUse">
      <rect width="3" height="1024" fill="#ffffff" opacity=".035"/>
    </pattern>
    <radialGradient id="ball" cx=".34" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".16" stop-color="#ff8a7a"/>
      <stop offset=".6" stop-color="#e2382a"/>
      <stop offset="1" stop-color="#8f1a12"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset="1" stop-color="#a87418"/>
    </linearGradient>
    <path id="trk" d="M300 150 C300 380 330 700 560 770 A170 170 0 0 0 560 430 A170 170 0 0 0 540 768 C760 800 880 880 920 1080"/>
    <mask id="rails" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <use href="#trk" fill="none" stroke="#fff" stroke-width="86" stroke-linecap="round"/>
      <use href="#trk" fill="none" stroke="#000" stroke-width="58" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#brush)"/>
  <!-- cross ties -->
  <use href="#trk" fill="none" stroke="#2b3035" stroke-width="112" stroke-dasharray="14 34" opacity=".9"/>
  <!-- rail shadow -->
  <rect width="1024" height="1024" fill="#000" opacity=".45" mask="url(#rails)" transform="translate(8,10)"/>
  <!-- steel rails -->
  <rect width="1024" height="1024" fill="#f1f5f8" mask="url(#rails)"/>
  <!-- funnel -->
  <path d="M190 40 H410 L340 170 H260 Z" fill="url(#brass)" stroke="#6e4c10" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="300" cy="46" rx="104" ry="20" fill="#4a3208" opacity=".55"/>
  <!-- marble at the top of the loop -->
  <ellipse cx="572" cy="470" rx="70" ry="16" fill="#000" opacity=".25"/>
  <circle cx="560" cy="420" r="78" fill="url(#ball)"/>
  <ellipse cx="530" cy="388" rx="26" ry="16" fill="#fff" opacity=".85" transform="rotate(-30 530 388)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
